<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Merci — VipOptimizer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&display=swap">
<style>
:root{--bg:#0b0616;--bg2:#120a24;--panel:#1a0f30;--stroke:#3a1f66;--fg:#f2ecff;--mut:#a594cf;
--pur:#9b4dff;--pur2:#c89bff;--glow:#b06bff;--cyan:#4fe3ff;--good:#5fe0a0;color-scheme:dark;}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
background:radial-gradient(900px 500px at 50% -10%,rgba(123,46,242,.3),transparent 60%),var(--bg);
color:var(--fg);font-family:"Rajdhani","Segoe UI",sans-serif}
.box{max-width:520px;width:100%;background:linear-gradient(180deg,var(--panel),var(--bg2));
border:1px solid var(--glow);border-radius:22px;padding:34px;text-align:center;
box-shadow:0 20px 60px rgba(123,46,242,.4)}
h1{font-family:"Orbitron",sans-serif;font-size:28px;margin:0 0 6px;
background:linear-gradient(90deg,#fff,var(--pur2),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.check{font-size:46px;margin-bottom:8px}
p{color:var(--mut);line-height:1.55;font-size:15px}
.codebox{background:#0d0720;border:1px dashed var(--glow);border-radius:14px;padding:20px;margin:20px 0}
.clabel{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--cyan);margin-bottom:10px}
#code{font-family:"Orbitron",sans-serif;font-size:32px;letter-spacing:4px;color:#fff}
.btn{display:inline-flex;align-items:center;gap:8px;margin-top:6px;cursor:pointer;border:0;
font-family:"Orbitron",sans-serif;font-weight:700;font-size:15px;color:#fff;padding:13px 26px;border-radius:12px;
background:linear-gradient(135deg,var(--pur),var(--glow));box-shadow:0 10px 26px rgba(155,77,255,.45);text-decoration:none}
.btn.ghost{background:transparent;border:1.5px solid var(--glow);color:var(--pur2);box-shadow:none}
.steps{text-align:left;margin:18px 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.steps li{display:flex;gap:10px;font-size:14.5px}.steps b{color:var(--pur2)}
.contact{font-size:14px;color:var(--fg);margin-top:10px}
small{color:var(--mut);font-size:12.5px}
</style>
</head>
<body>
  <div class="box">
    <div class="check">✅</div>
    <h1>Paiement réussi</h1>
    <p>Merci pour ton achat de VipOptimizer. Voici ton code d'accès.</p>

    <div class="codebox">
      <div class="clabel">Ton code</div>
      <div id="code">—</div>
    </div>
    <button class="btn ghost" onclick="copyCode()">📋 Copier le code</button>

    <ul class="steps">
      <li><b>1.</b> Copie ton code ci-dessus.</li>
      <li><b>2.</b> Rejoins le Discord et crée un ticket.</li>
      <li><b>3.</b> Donne ton code → tu reçois VipOptimizer.</li>
    </ul>

    <p class="contact">💬 <b>Rejoins le Discord : discord.gg/ton_lien</b></p>
    <small>Garde ce code précieusement.</small>
  </div>
<script>
// Code = 7 chiffres + 3 lettres, mélangés. Stable par achat (gardé même si refresh).
function gen(){
  var D="0123456789", L="ABCDEFGHJKLMNPQRSTUVWXYZ", a=[];
  for(var i=0;i<7;i++) a.push(D[Math.floor(Math.random()*D.length)]);
  for(var j=0;j<3;j++) a.push(L[Math.floor(Math.random()*L.length)]);
  for(var k=a.length-1;k>0;k--){var r=Math.floor(Math.random()*(k+1));var t=a[k];a[k]=a[r];a[r]=t;}
  return a.join("");
}
// clé : l'id de session Stripe si présent, sinon une clé fixe navigateur
var sid = new URLSearchParams(location.search).get("session_id") || "default";
var key = "vip_code_" + sid, code;
try{ code = localStorage.getItem(key); }catch(e){}
if(!code){ code = gen(); try{ localStorage.setItem(key, code); }catch(e){} }
document.getElementById("code").textContent = code;
function copyCode(){
  navigator.clipboard.writeText(code).then(function(){
    var b=event.target,t=b.textContent;b.textContent="✓ Copié !";setTimeout(function(){b.textContent=t;},1500);
  }).catch(function(){
    var r=document.createRange();r.selectNodeContents(document.getElementById("code"));
    var s=getSelection();s.removeAllRanges();s.addRange(r);
  });
}
</script>
</body>
</html>
